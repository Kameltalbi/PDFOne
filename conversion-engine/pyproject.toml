[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one2pdf-conversion-engine"
version = "0.1.0"
description = "Open-source PDF to structured DOCX conversion engine"
requires-python = ">=3.9"
dependencies = [
  "pdfplumber>=0.11,<0.12",
  "pypdfium2>=4.30,<6",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.9,<5"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "reportlab>=4,<5"]

[project.scripts]
one2pdf-convert = "conversion_engine.cli:main"
one2pdf-pdf-to-excel = "conversion_engine.pdf_to_excel.cli:main"
one2pdf-pdf-to-image = "conversion_engine.pdf_to_image.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
